name: Trigger Daily Blog Generator

on:
  schedule:
    # Runs daily at 12:00 PM UTC (5:30 PM IST)
    # Adjust this cron expression if you want a different time
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trigger_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook Request
        run: |
          curl -s -X GET "https://automation-blogs.onrender.com/api/run-daily-blogs/?secret=automation123"

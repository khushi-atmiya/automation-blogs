<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ blog.title }}{% endblock %}</title>
    <!-- Tailwind CSS v3/v4 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;700;900&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    </style>
    {% block seo_meta %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <!-- Global Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="https://{{ domain }}" class="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                <span class="w-3 h-6 bg-blue-600 rounded-sm"></span>
                {{ domain|upper }}
            </a>
            <nav class="hidden md:flex items-center gap-6">
                <a href="https://{{ domain }}/" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Home</a>
                <a href="https://{{ domain }}/games/" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Games</a>
                <a href="https://{{ domain }}/download/" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Downloads</a>
                <a href="https://{{ domain }}/about/" class="text-sm font-semibold text-slate-600 hover:text-slate-900">About</a>
            </nav>
        </div>
    </header>

    <!-- Page Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-6">
            <span class="text-sm">&copy; {% now "Y" %} {{ domain }}. All rights reserved.</span>
            <div class="flex gap-6 text-sm">
                <a href="https://{{ domain }}/privacy-policy/" class="hover:underline">Privacy Policy</a>
                <a href="https://{{ domain }}/contact/" class="hover:underline">Contact</a>
            </div>
        </div>
    </footer>

</body>
</html>
